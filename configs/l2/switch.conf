! A layer-2 switch: two access ports in VLAN 10, one in VLAN 20, and an
! 802.1Q trunk carrying both VLANs.
hostname sw1
vlan 10,20
interface Ethernet0
  port sw-h1
  switchport access vlan 10
interface Ethernet1
  port sw-h2
  switchport access vlan 10
interface Ethernet2
  port sw-h3
  switchport access vlan 20
interface Ethernet3
  port sw-h4
  switchport mode trunk
  switchport trunk allowed vlan 10,20
