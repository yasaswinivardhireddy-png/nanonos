! Spine 1: routed ports to both leaves. Both spines share one ASN, as in
! RFC 7938, so paths through a spine never loop back into the spine layer.
hostname spine1
interface Ethernet0
  port s1-l1
  description leaf1 Ethernet4
  ip address 10.0.0.1/31
interface Ethernet1
  port s1-l2
  description leaf2 Ethernet4
  ip address 10.0.2.1/31
lldp
  tx-interval 2
router bgp 4200000100
  router-id 10.255.0.11
  timers 1 3
  neighbor 10.0.0.0 remote-as 4200000001
  neighbor 10.0.0.0 description leaf1
  neighbor 10.0.0.0 ttl-security hops 1
  neighbor 10.0.2.0 remote-as 4200000002
  neighbor 10.0.2.0 description leaf2
  neighbor 10.0.2.0 ttl-security hops 1
