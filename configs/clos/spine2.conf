! Spine 2: routed ports to both leaves.
hostname spine2
interface Ethernet0
  port s2-l1
  description leaf1 Ethernet5
  ip address 10.0.1.1/31
interface Ethernet1
  port s2-l2
  description leaf2 Ethernet5
  ip address 10.0.3.1/31
lldp
  tx-interval 2
router bgp 4200000100
  router-id 10.255.0.12
  timers 1 3
  neighbor 10.0.1.0 remote-as 4200000001
  neighbor 10.0.1.0 description leaf1
  neighbor 10.0.1.0 ttl-security hops 1
  neighbor 10.0.3.0 remote-as 4200000002
  neighbor 10.0.3.0 description leaf2
  neighbor 10.0.3.0 ttl-security hops 1
