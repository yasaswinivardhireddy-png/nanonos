! Leaf 1 of a 2-leaf / 2-spine fabric (RFC 7938 style: eBGP everywhere,
! private 4-octet ASNs, routed /31 uplinks, one server VLAN).
hostname leaf1
interface Ethernet0
  port l1-h1
  description server h1
  switchport access vlan 10
  storm-control broadcast pps 1000
  port-security max-mac 16
interface Ethernet4
  port l1-s1
  description spine1 Ethernet0
  ip address 10.0.0.0/31
interface Ethernet5
  port l1-s2
  description spine2 Ethernet0
  ip address 10.0.1.0/31
interface Vlan10
  ip address 10.1.1.1/24
lldp
  tx-interval 2
router bgp 4200000001
  router-id 10.255.0.1
  timers 1 3
  maximum-paths 8
  network 10.1.1.0/24
  neighbor 10.0.0.1 remote-as 4200000100
  neighbor 10.0.0.1 description spine1
  neighbor 10.0.0.1 ttl-security hops 1
  neighbor 10.0.1.1 remote-as 4200000100
  neighbor 10.0.1.1 description spine2
  neighbor 10.0.1.1 ttl-security hops 1
