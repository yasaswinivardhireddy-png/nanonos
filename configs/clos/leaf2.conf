! Leaf 2 of a 2-leaf / 2-spine fabric.
hostname leaf2
interface Ethernet0
  port l2-h2
  description server h2
  switchport access vlan 10
  storm-control broadcast pps 1000
  port-security max-mac 16
interface Ethernet4
  port l2-s1
  description spine1 Ethernet1
  ip address 10.0.2.0/31
interface Ethernet5
  port l2-s2
  description spine2 Ethernet1
  ip address 10.0.3.0/31
interface Vlan10
  ip address 10.2.2.1/24
lldp
  tx-interval 2
router bgp 4200000002
  router-id 10.255.0.2
  timers 1 3
  maximum-paths 8
  network 10.2.2.0/24
  neighbor 10.0.2.1 remote-as 4200000100
  neighbor 10.0.2.1 description spine1
  neighbor 10.0.2.1 ttl-security hops 1
  neighbor 10.0.3.1 remote-as 4200000100
  neighbor 10.0.3.1 description spine2
  neighbor 10.0.3.1 ttl-security hops 1
